services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: sql-practice-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: practice
      POSTGRES_PASSWORD: practice123
      POSTGRES_DB: sqlpractice
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql

volumes:
  pg_data: